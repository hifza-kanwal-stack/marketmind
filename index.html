<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design World — Explore New Ideas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#000; --fg:#fff; --pad-x: clamp(20px, 6.95vw, 120px) }
    html, body { height:100%; margin:0; background:#000; color:#fff; font-family:'Poppins',sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
    .hero { position:relative; width:100%; height:100vh; height:100svh; min-height:520px; overflow:hidden; background:#000 }
    #scene { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none }
    #scene.dragging { cursor:grabbing }
    .ui { position:absolute; inset:0; pointer-events:none; z-index:2 }
    .ui a, .ui button { pointer-events:auto }
    .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap }

    .nav { position:absolute; top:clamp(24px,4.7vh,40px); left:var(--pad-x); right:var(--pad-x); display:flex; align-items:center; justify-content:space-between }
    .logo { display:flex; align-items:center; gap:8px; color:#fff; text-decoration:none; font-size:15px; letter-spacing:-0.01em }
    .logo-mark { width:20px; height:40px; background:#fff; border-radius:0 20px 20px 0 }
    .logo b { font-weight:700 }   .logo span { font-weight:400 }
    .nav-links { display:flex; gap:clamp(20px,4.1vw,60px); list-style:none; margin:0; padding:0 }
    .nav-links a { color:#fff; text-decoration:none; font-size:15px; font-weight:500; position:relative; cursor:pointer }
    .nav-links a::after { content:''; position:absolute; left:0; right:0; bottom:-4px; height:1px; background:currentColor; transform:scaleX(0); transform-origin:right; transition:transform .35s ease }
    .nav-links a:hover::after { transform:scaleX(1); transform-origin:left }

    .arrows { position:absolute; top:18.9%; left:76.7%; display:flex; gap:32px; transform:translate(-19px,-50%) }
    .arrow { width:38px; height:38px; border-radius:50%; border:2.5px solid #fff; background:transparent; color:#fff; display:grid; place-items:center; cursor:pointer; transition:background .25s, color .25s }
    .arrow svg { width:18px; height:18px }
    .arrow:hover { background:#fff; color:#000 }

    .dots { position:absolute; right:calc(var(--pad-x) - 7px); top:49.4%; transform:translateY(-50%); display:flex; flex-direction:column; gap:33px }
    .dot { width:14px; height:14px; border-radius:50%; border:2px solid #fff; background:#fff; cursor:pointer; transition:background .25s }
    .dot.active { background:transparent }

    .tagline { position:absolute; left:var(--pad-x); bottom:clamp(40px,7.5vh,70px); font-size:clamp(24px,2.65vw,44px); line-height:1.2; font-weight:300; letter-spacing:-0.01em }
    .tagline strong { font-weight:700; display:block }

    .cta-row { position:absolute; left:45.6%; right:-1vw; top:88.7%; transform:translateY(-50%); display:flex; align-items:center }
    .cta { flex:none; padding:0 15px; height:48px; display:inline-flex; align-items:center; border:1.5px solid rgba(255,255,255,.85); border-radius:6px; background:rgba(0,0,0,.15); color:#fff; font-size:14px; font-weight:400; text-decoration:none; cursor:pointer; transition:background .25s, color .25s }
    .cta:hover { background:#fff; color:#000 }
    .cta-line { flex:1; height:1.5px; background:rgba(255,255,255,.8); min-width:40px }
    .count { flex:none; font-size:clamp(140px,19.8vw,360px); font-weight:400; line-height:1; letter-spacing:-0.02em; color:transparent; -webkit-text-stroke:1.5px rgba(255,255,255,.9); transform:translateY(6%); user-select:none }

    .loader { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:12px; letter-spacing:.2em; text-transform:uppercase; opacity:.6; transition:opacity .6s }
    .loader.done { opacity:0 }

    @media (max-width:900px), (max-aspect-ratio:1/1) {
      .arrows { left:auto; right:var(--pad-x); top:15%; transform:translateY(-50%); gap:14px }
      .tagline { bottom:clamp(150px,20vh,220px) }
      .cta-row { left:var(--pad-x); right:-3vw; top:auto; bottom:24px; transform:none }
      .count { font-size:clamp(120px,22vw,200px) }
    }
    @media (max-width:640px) {
      .nav-links { gap:16px }
      .nav-links a, .logo { font-size:13px }
      .dots { gap:20px; right:16px }
      .dot { width:10px; height:10px }
      .cta-row { right:-8vw }
      .count { font-size:120px }
    }
    @media (max-width:420px) { .nav-links li:nth-child(2) { display:none } }
  </style>
</head>
<body>
  <section class="hero" id="hero">
    <canvas id="scene" aria-label="Rotatable glass cube. Drag to rotate."></canvas>
    <div class="ui">
      <h1 class="sr-only">Explore New Ideas</h1>
      <header class="nav">
        <a href="#" class="logo"><i class="logo-mark"></i><b>Design</b><span>World</span></a>
        <ul class="nav-links"><li><a>Home</a></li><li><a>Portfolio</a></li><li><a>Contact Us</a></li></ul>
      </header>
      <div class="arrows">
        <button class="arrow" id="prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
        <button class="arrow" id="next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
      <nav class="dots"><button class="dot"></button><button class="dot active"></button><button class="dot"></button></nav>
      <p class="tagline">Let's Build the<br>Future of <strong>Design.</strong></p>
      <div class="cta-row">
        <a href="#" class="cta">Explore Now</a>
        <span class="cta-line"></span>
        <span class="count" aria-hidden="true">07</span>
      </div>
      <div class="loader" id="loader">Loading model</div>
    </div>
  </section>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    const MODEL_URL = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260929_212926_92423081-b0e4-4f5a-b650-14af6c05c058.glb';

    const canvas = document.querySelector('#scene');
    const loaderEl = document.querySelector('#loader');
    let renderer, camera, bgScene, scene, cubeMesh, pivot, spinner;
    let rtBack, rtFront, bgMat, frontMat, backMat, bgCtx, bgCanvas, bgTexture;

    const params = {
      iowR: 1.15, iorY: 1.16, iorG: 1.18, iorC: 1.22, iorB: 1.22, iorP: 1.22,
      refractPower: 0.30, chromatic: 0.5, saturation: 1.08,
      shininess: 90, diffuseness: 0.02, fresnelPower: 5.0
    };

    let isDragging = false, previousMousePosition = { x: 0, y: 0 };
    let velocity = { x: 0, y: 0 };
    let lastTime = performance.now();
    let targetRotationY = 0, targetRotationX = 0;
    let idleTime = 0;

    function init() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio, 2);

      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
      renderer.setPixelRatio(dpr);
      renderer.setSize(width, height);
      renderer.setClearColor(0x000000);
      renderer.autoClear = false;

      camera = new THREE.PerspectiveCamera(30, width / height, 0.1, 100);
      camera.position.z = 10;

      bgScene = new THREE.Scene();
      scene = new THREE.Scene();

      pivot = new THREE.Group();
      spinner = new THREE.Group();
      pivot.add(spinner);
      scene.add(pivot);

      bgCanvas = document.createElement('canvas');
      bgCtx = bgCanvas.getContext('2d');
      updateBgCanvasSize();

      bgTexture = new THREE.CanvasTexture(bgCanvas);
      bgTexture.colorSpace = THREE.SRGBColorSpace;
      bgTexture.minFilter = THREE.LinearFilter;
      bgTexture.generateMipmaps = false;

      const bgGeo = new THREE.PlaneGeometry(2, 2);
      bgMat = new THREE.ShaderMaterial({
        uniforms: { uTex: { value: bgTexture } },
        vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
        fragmentShader: `uniform sampler2D uTex; varying vec2 vUv; void main() { gl_FragColor = texture2D(uTex, vUv); \n #include <colorspace_fragment> }`,
        depthTest: false, depthWrite: false
      });
      const bgQuad = new THREE.Mesh(bgGeo, bgMat);
      bgQuad.frustumCulled = false;
      bgScene.add(bgQuad);

      const rtOpts = {
        minFilter: THREE.LinearFilter,
        magFilter: THREE.LinearFilter,
        type: THREE.HalfFloatType,
        colorSpace: THREE.SRGBColorSpace
      };
      rtBack = new THREE.WebGLRenderTarget(width * dpr, height * dpr, rtOpts);
      rtFront = new THREE.WebGLRenderTarget(width * dpr, height * dpr, rtOpts);

      const commonShaderChunks = {
        vertex: `
          varying vec3 vNormal;
          varying vec3 vEye;
          varying vec3 vWorldPos;
          void main() {
            vec4 worldPos = modelMatrix * vec4(position, 1.0);
            vec4 mvPos = viewMatrix * worldPos;
            gl_Position = projectionMatrix * mvPos;
            vNormal = normalize(normalMatrix * normal);
            vEye = normalize(mvPos.xyz);
            vWorldPos = worldPos.xyz;
          }
        `,
        fragment: `
          uniform sampler2D uTexture;
          uniform vec2 uResolution;
          uniform float uBackside;
          uniform float uRefractPower;
          uniform float uChromatic;
          uniform float uSaturation;
          uniform float uShininess;
          uniform float uDiffuseness;
          uniform float uFresnelPower;
          uniform vec3 uLight;
          varying vec3 vNormal;
          varying vec3 vEye;

          vec3 lumaWeights = vec3(0.2125, 0.7154, 0.0721);

          void main() {
            vec2 uv = gl_FragCoord.xy / uResolution;
            vec3 n = normalize(vNormal);
            if (uBackside > 0.5) n = -n;
            vec3 eye = normalize(vEye);

            vec3 sumColor = vec3(0.0);
            float iorR = 1.15, iorY = 1.16, iorG = 1.18, iorC = 1.22, iorB = 1.22, iorP = 1.22;
            int LOOP = 16;
            
            for (int i = 0; i < 16; i++) {
              float slide = float(i) / float(LOOP) * 0.045;
              vec3 refrR = refract(eye, n, 1.0 / iorR);
              vec3 refrY = refract(eye, n, 1.0 / iorY);
              vec3 refrG = refract(eye, n, 1.0 / iorG);
              vec3 refrC = refract(eye, n, 1.0 / iorC);
              vec3 refrB = refract(eye, n, 1.0 / iorB);
              vec3 refrP = refract(eye, n, 1.0 / iorP);

              float pwr = uRefractPower + slide;
              vec4 texR = texture2D(uTexture, uv + refrR.xy * pwr * uChromatic);
              vec4 texY = texture2D(uTexture, uv + refrY.xy * pwr * uChromatic);
              vec4 texG = texture2D(uTexture, uv + refrG.xy * pwr * uChromatic);
              vec4 texC = texture2D(uTexture, uv + refrC.xy * pwr * uChromatic);
              vec4 texB = texture2D(uTexture, uv + refrB.xy * pwr * uChromatic);
              vec4 texP = texture2D(uTexture, uv + refrP.xy * pwr * uChromatic);

              float r = texR.x * 0.5;
              float y = (texY.x * 2.0 + texY.y * 2.0 - texY.z) / 6.0;
              float g = texG.y * 0.5;
              float c = (texC.y * 2.0 + texC.z * 2.0 - texC.x) / 6.0;
              float b = texB.z * 0.5;
              float p = (texP.z * 2.0 + texP.x * 2.0 - texP.y) / 6.0;

              float R = r + (2.0*p + 2.0*y - c) / 3.0;
              float G = g + (2.0*y + 2.0*c - p) / 3.0;
              float B = b + (2.0*c + 2.0*p - y) / 3.0;
              sumColor += vec3(R, G, B);
            }
            vec3 color = sumColor / float(LOOP);
            float luma = dot(color, lumaWeights);
            color = mix(vec3(luma), color, uSaturation);

            vec3 lightVec = normalize(-uLight);
            vec3 halfVec = normalize(lightVec - eye);
            float spec1 = pow(max(dot(n, halfVec), 0.0), uShininess) + max(0.0, dot(n, lightVec)) * uDiffuseness;
            vec3 light2 = vec3(1.0, 1.0, -1.0);
            float spec2 = pow(max(dot(n, normalize(light2 - eye)), 0.0), uShininess * 0.6) + max(0.0, dot(n, normalize(light2))) * (uDiffuseness * 0.5);
            float spec = spec1 + 0.6 * spec2;
            color += spec * (uBackside > 0.5 ? 0.35 : 1.0);

            float f = pow(1.0 + dot(eye, n), uFresnelPower);
            color = mix(color, vec3(1.0), f * (uBackside > 0.5 ? 0.25 : 0.55));
            color += vec3(0.004, 0.005, 0.007);

            gl_FragColor = vec4(color, 1.0);
            \n #include <colorspace_fragment>
          }
        `
      };

      const uniformValues = {
        uTexture: { value: null },
        uResolution: { value: new vec2Real(width * dpr, height * dpr) },
        uBackside: { value: 0 },
        uRefractPower: { value: 0.30 },
        uChromatic: { value: params.chromatic },
        uSaturation: { value: params.saturation },
        uShininess: { value: params.shininess },
        uDiffuseness: { value: params.diffuseness },
        uFresnelPower: { value: params.fresnelPower },
        uLight: { value: new THREE.Vector3(-1, 1, 1) }
      };

      function vec2Real(x, y) { return new THREE.Vector2(x, y); }

      frontMat = new THREE.ShaderMaterial({
        vertexShader: commonShaderChunks.vertex,
        fragmentShader: commonShaderChunks.fragment,
        uniforms: THREE.UniformsUtils.clone(uniformValues),
        side: THREE.FrontSide
      });

      backMat = new THREE.ShaderMaterial({
        vertexShader: commonShaderChunks.vertex,
        fragmentShader: commonShaderChunks.fragment,
        uniforms: THREE.UniformsUtils.clone(uniformValues),
        side: THREE.BackSide
      });
      backMat.uniforms.uBackside.value = 1.0;
      backMat.uniforms.uRefractPower.value = 0.22;

      loadModel();
      setupEvents();

      Promise.race([
        Promise.all([document.fonts.load('800 100px Poppins'), document.fonts.ready]),
        new Promise(resolve => setTimeout(resolve, 2500))
      ]).then(() => {
        updateBgCanvas();
        layout();
        requestAnimationFrame(animate);
      });
    }

    function updateBgCanvasSize() {
      const dpr = Math.min(window.devicePixelRatio, 2);
      bgCanvas.width = window.innerWidth * dpr;
      bgCanvas.height = window.innerHeight * dpr;
      bgCtx.scale(dpr, dpr);
    }

    function updateBgCanvas() {
      const W = window.innerWidth;
      const H = window.innerHeight;
      bgCtx.fillStyle = '#000000';
      bgCtx.fillRect(0, 0, W, H);

      const mobile = (W < 768) || (W / H < 1);
      let fs = Math.min(H * 0.21, W * (mobile ? 0.21 : 0.118));
      bgCtx.font = `800 ${fs}px Poppins`;

      const lines = ['Explore', 'New', 'Ideas'];
      let maxWidth = 0;
      lines.forEach(l => {
        const w = bgCtx.measureText(l).width;
        if (w > maxWidth) maxWidth = w;
      });

      const maxAllowedW = W * (mobile ? 0.9 : 0.5);
      if (maxWidth > maxAllowedW) {
        fs *= (maxAllowedW / maxWidth);
        bgCtx.font = `800 ${fs}px Poppins`;
      }

      bgCtx.fillStyle = '#e9e9e9';
      bgCtx.textAlign = 'center';
      bgCtx.textBaseline = 'alphabetic';

      const cx = W * (mobile ? 0.5 : 0.505);
      const cy = H * (mobile ? 0.45 : 0.468);
      const gap = fs * 1.07;
      const capHeight = fs * 0.7;

      lines.forEach((line, i) => {
        const y = cy + capHeight / 2 + (i - 1) * gap;
        bgCtx.fillText(line, cx, y);
      });

      if (bgTexture) bgTexture.needsUpdate = true;
    }

    function loadModel() {
      const loader = new GLTFLoader();
      loader.load(MODEL_URL, (gltf) => {
        let meshes = [];
        gltf.scene.traverse((child) => {
          if (child.isMesh) {
            let g = child.geometry.clone();
            g.deleteAttribute('uv');
            g.deleteAttribute('color');
            g.deleteAttribute('tangent');
            g = mergeVertices(g, 1e-4);
            g.computeVertexNormals();
            g.applyMatrix4(child.matrixWorld);
            meshes.push(g);
          }
        });

        let finalGeo;
        if (meshes.length > 0) {
          finalGeo = mergeGeometries(meshes, false);
        }
        if (!finalGeo) {
          finalGeo = new RoundedBoxGeometry(1, 1, 1, 8, 0.12);
        }

        finalGeo.computeBoundingBox();
        const box = finalGeo.boundingBox;
        const center = new THREE.Vector3();
        box.getCenter(center);
        finalGeo.translate(-center.x, -center.y, -center.z);

        const size = new THREE.Vector3();
        box.getSize(size);
        const maxDim = Math.max(size.x, size.y, size.z);
        finalGeo.scale(1 / maxDim, 1 / maxDim, 1 / maxDim);

        const group = new THREE.Group();
        const backMesh = new THREE.Mesh(finalGeo, backMat);
        const frontMesh = new THREE.Mesh(finalGeo, frontMat);
        group.add(backMesh);
        group.add(frontMesh);
        spinner.add(group);
        cubeMesh = group;

        spinner.rotation.set(-0.42, 0.62, 0.18);
        loaderEl.classList.add('done');
      }, undefined, () => {
        let fallbackGeo = new RoundedBoxGeometry(1, 1, 1, 8, 0.12);
        const group = new THREE.Group();
        group.add(new THREE.Mesh(fallbackGeo, backMat));
        group.add(new THREE.Mesh(fallbackGeo, frontMat));
        spinner.add(group);
        cubeMesh = group;
        spinner.rotation.set(-0.42, 0.62, 0.18);
        loaderEl.classList.add('done');
      });
    }

    function layout() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio, 2);

      camera.aspect = width / height;
      camera.updateProjectionMatrix();

      renderer.setSize(width, height);
      rtBack.setSize(width * dpr, height * dpr);
      rtFront.setSize(width * dpr, height * dpr);

      frontMat.uniforms.uResolution.value.set(width * dpr, height * dpr);
      backMat.uniforms.uResolution.value.set(width * dpr, height * dpr);

      const mobile = (width < 768) || (width / height < 1);
      const visH = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * 10;
      const visW = visH * camera.aspect;

      const sx = mobile ? 0.5 : 0.517;
      const sy = mobile ? 0.45 : 0.488;
      pivot.position.set((sx - 0.5) * visW, (0.5 - sy) * visH, 0);

      const px = Math.min(height * 0.44, width * (mobile ? 0.45 : 0.29));
      const scale = (px / height) * visH;
      pivot.scale.set(scale, scale, scale);
    }

    function setupEvents() {
      window.addEventListener('resize', () => {
        updateBgCanvasSize();
        updateBgCanvas();
        layout();
      });

      canvas.addEventListener('pointerdown', (e) => {
        isDragging = true;
        canvas.classList.add('dragging');
        previousMousePosition = { x: e.clientX, y: e.clientY };
        canvas.setPointerCapture(e.pointerId);
        targetRotationY = 0;
        targetRotationX = 0;
        idleTime = 0;
      });

      canvas.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const deltaX = e.clientX - previousMousePosition.x;
        const deltaY = e.clientY - previousMousePosition.y;

        const dx = deltaX * 0.008;
        const dy = deltaY * 0.008;

        velocity.x = dx;
        velocity.y = dy;

        const qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), dx);
        const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), dy);
        spinner.quaternion.premultiply(qX).premultiply(qY);

        previousMousePosition = { x: e.clientX, y: e.clientY };
        idleTime = 0;
      });

      canvas.addEventListener('pointerup', (e) => {
        isDragging = false;
        canvas.classList.remove('dragging');
        canvas.releasePointerCapture(e.pointerId);
      });

      document.getElementById('prev').addEventListener('click', () => {
        targetRotationY -= Math.PI / 2;
        idleTime = 0;
      });
      document.getElementById('next').addEventListener('click', () => {
        targetRotationY += Math.PI / 2;
        idleTime = 0;
      });

      const dots = document.querySelectorAll('.dot');
      dots.forEach((dot, idx) => {
        dot.addEventListener('click', () => {
          dots.forEach(d => d.classList.remove('active'));
          dot.classList.add('active');
          targetRotationY += (idx - 1) * (Math.PI / 3);
          idleTime = 0;
        });
      });
    }

    function animate(currentTime) {
      requestAnimationFrame(animate);
      const dt = Math.min((currentTime - lastTime) / 1000, 0.05);
      lastTime = currentTime;

      if (!isDragging) {
        idleTime += dt;
        if (Math.abs(targetRotationY) > 0.0005 || Math.abs(targetRotationX) > 0.0005) {
          const stepY = targetRotationY * Math.min(1, 9 * dt);
          const stepX = targetRotationX * Math.min(1, 9 * dt);
          const qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), stepY);
          const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), stepX);
          spinner.quaternion.premultiply(qX).premultiply(qY);
          targetRotationY -= stepY;
          targetRotationX -= stepX;
        } else if (idleTime > 0.6) {
          const driftBlend = Math.min(1, (idleTime - 0.6) / 1.0);
          const dx = 0.0035 * driftBlend * (dt * 60);
          const dy = 0.0012 * driftBlend * (dt * 60);
          const qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), dx);
          const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), dy);
          spinner.quaternion.premultiply(qX).premultiply(qY);
        } else {
          velocity.x *= Math.pow(0.94, dt * 60);
          velocity.y *= Math.pow(0.94, dt * 60);
          if (Math.abs(velocity.x) > 0.0001 || Math.abs(velocity.y) > 0.0001) {
            const qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), velocity.x);
            const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), velocity.y);
            spinner.quaternion.premultiply(qX).premultiply(qY);
          }
        }
      }

      if (cubeMesh) cubeMesh.visible = false;
      renderer.setRenderTarget(rtBack);
      renderer.render(bgScene, camera);

      renderer.setRenderTarget(rtFront);
      renderer.render(bgScene, camera);
      if (cubeMesh) {
        cubeMesh.visible = true;
        cubeMesh.children[0].visible = true;
        cubeMesh.children[1].visible = false;
        renderer.render(scene, camera);
      }

      renderer.setRenderTarget(null);
      renderer.render(bgScene, camera);
      if (cubeMesh) {
        renderer.clearDepth();
        cubeMesh.children[0].visible = false;
        cubeMesh.children[1].visible = true;
        renderer.render(scene, camera);
      }
    }

    init();
  </script>
</body>
</html>
